<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Gestão de Estudos</title>
    <meta name="description" content="Aplicativo de gestão de conhecimento pessoal">
    <meta name="theme-color" content="#1a1a1a">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/icon-192x192.png">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
        import { getStorage } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';
        import { getAnalytics } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js';
        
        window.firebaseConfig = {
            apiKey: "AIzaSyA9rBy4ZbRdEAfRkRRs5-hF6B70AqWDMKw",
            authDomain: "studyflow-d0246.firebaseapp.com",
            projectId: "studyflow-d0246",
            storageBucket: "studyflow-d0246.firebasestorage.app",
            messagingSenderId: "507057638812",
            appId: "1:507057638812:web:e392d651eecfad75520c59",
            measurementId: "G-LFFELHBQMZ"
        };
        
        window.firebaseApp = initializeApp(window.firebaseConfig);
        window.auth = getAuth(window.firebaseApp);
        window.db = getFirestore(window.firebaseApp);
        window.storage = getStorage(window.firebaseApp);
        
        // Initialize analytics only if supported
        try {
            window.analytics = getAnalytics(window.firebaseApp);
        } catch (error) {
            console.log('Analytics not available:', error);
        }
    </script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="topics.css">
    <link rel="stylesheet" href="books.css">
    <link rel="stylesheet" href="articles.css">
    <link rel="stylesheet" href="notes.css">
    <link rel="stylesheet" href="focus.css">
    <link rel="stylesheet" href="priorities.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Carregando StudyFlow...</p>
    </div>

    <!-- Auth Container -->
    <div id="auth-container" class="auth-container hidden">
        <div class="auth-card">
            <h1>StudyFlow</h1>
            <p>Sua jornada de conhecimento começa aqui</p>
            <button id="google-login" class="btn btn-primary">
                <span>Entrar com Google</span>
            </button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app hidden">
        <!-- Navigation -->
        <nav class="nav">
            <div class="nav-brand">
                <h1>StudyFlow</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="#dashboard" class="nav-link active" data-section="dashboard">Dashboard</a></li>
                <li><a href="#topics" class="nav-link" data-section="topics">Tópicos</a></li>
                <li><a href="#books" class="nav-link" data-section="books">Livros</a></li>
                <li><a href="#articles" class="nav-link" data-section="articles">Artigos/Vídeos</a></li>
                <li><a href="#priorities" class="nav-link" data-section="priorities">Prioridades</a></li>
            </ul>
            <div class="nav-user">
                <button id="user-menu" class="btn-user">
                    <img id="user-avatar" src="" alt="Avatar" class="user-avatar">
                </button>
                <button id="logout-btn" class="btn btn-ghost">Sair</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <!-- Content will be loaded dynamically -->
        </main>

        <!-- Active Study Session Panel -->
        <div id="active-session-panel" class="active-session-panel hidden">
          <div class="session-info">
            <div class="session-topic">
              <span class="session-label">Estudando:</span>
              <span id="session-topic-name">Tópico</span>
            </div>
            <div class="session-timer">
              <span id="session-elapsed-time">00:00:00</span>
            </div>
          </div>
          <div class="session-controls">
            <button id="session-music-btn" class="btn-session-control" title="Configurar Música"><span class="material-icons">music_note</span></button>
            <button id="session-music-toggle-btn" class="btn-session-control" title="Pausar/Retomar Música" style="display: none;"><span class="material-icons">volume_up</span></button>
            <button id="session-pause-btn" class="btn-session-control" title="Pausar/Continuar"><span class="material-icons">pause</span></button>
            <button id="session-stop-btn" class="btn-session-control" title="Finalizar"><span class="material-icons">stop</span></button>
            <button id="session-maximize-btn" class="btn-session-control" title="Maximizar"><span class="material-icons">open_in_full</span></button>
          </div>
        </div>

        <!-- Session Music Modal -->
        <div id="session-music-modal" class="modal hidden">
          <div class="modal-content">
            <div class="modal-header">
              <h2>Música de Estudo</h2>
              <button id="close-music-modal" class="btn-close"><span class="material-icons">close</span></button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">Link do YouTube</label>
                <div class="youtube-input-group">
                  <input type="text" id="session-youtube-link" class="form-input" placeholder="Cole o link do YouTube aqui...">
                  <button type="button" id="session-load-video" class="btn btn-secondary">Carregar</button>
                </div>
              </div>

              <div class="video-container" id="session-video-container" style="display: none;">
                <iframe id="session-youtube-iframe" width="100%" height="200" frameborder="0"></iframe>
              </div>

              <div class="music-presets">
                <p class="form-label">Sugestões Rápidas:</p>
                <div class="preset-buttons">
                  <button class="btn-preset" data-video="jfKfPfyJRdk">Lofi Hip Hop</button>
                  <button class="btn-preset" data-video="5qap5aO4i9A">Chuva</button>
                  <button class="btn-preset" data-video="4xDzrJKXOOY">Piano Clássico</button>
                  <button class="btn-preset" data-video="hHW1oY26kxQ">Sons da Natureza</button>
                  <button class="btn-preset" data-video="M3xJZLqUQwQ">Café Ambient</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Quick Notes Modal -->
        <div id="session-notes-modal" class="modal hidden">
          <div class="modal-content">
            <div class="modal-header">
              <h2>Finalizar Sessão de Estudo</h2>
              <button id="close-session-modal" class="btn-close"><span class="material-icons">close</span></button>
            </div>
            <div class="modal-body">
              <div class="session-summary">
                <p><strong>Tópico:</strong> <span id="summary-topic-name"></span></p>
                <p><strong>Duração:</strong> <span id="summary-duration"></span></p>
              </div>
              <div class="form-group">
                <label class="form-label">Anotações da Sessão (opcional)</label>
                <textarea id="session-quick-notes" class="form-input" rows="4" placeholder="O que você aprendeu? Insights importantes..."></textarea>
              </div>
              <div class="form-actions">
                <button id="save-session-btn" class="btn btn-primary">Salvar Sessão</button>
                <button id="discard-session-btn" class="btn btn-secondary">Descartar</button>
              </div>
            </div>
          </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="app.js"></script>
</body>
</html>
