<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Gestão de Estudos</title>
    <meta name="description" content="Aplicativo de gestão de conhecimento pessoal">
    <meta name="theme-color" content="#1a1a1a">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/icon-192x192.png">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
        import { getStorage } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js';
        import { getAnalytics } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js';
        
        window.firebaseConfig = {
            apiKey: "AIzaSyA9rBy4ZbRdEAfRkRRs5-hF6B70AqWDMKw",
            authDomain: "studyflow-d0246.firebaseapp.com",
            projectId: "studyflow-d0246",
            storageBucket: "studyflow-d0246.firebasestorage.app",
            messagingSenderId: "507057638812",
            appId: "1:507057638812:web:e392d651eecfad75520c59",
            measurementId: "G-LFFELHBQMZ"
        };
        
        window.firebaseApp = initializeApp(window.firebaseConfig);
        window.auth = getAuth(window.firebaseApp);
        window.db = getFirestore(window.firebaseApp);
        window.storage = getStorage(window.firebaseApp);
        
        // Initialize analytics only if supported
        try {
            window.analytics = getAnalytics(window.firebaseApp);
        } catch (error) {
            console.log('Analytics not available:', error);
        }
    </script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="topics.css">
    <link rel="stylesheet" href="books.css">
    <link rel="stylesheet" href="notes.css">
    <link rel="stylesheet" href="study.css">
    <link rel="stylesheet" href="focus.css">
    <link rel="stylesheet" href="timer.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Carregando StudyFlow...</p>
    </div>

    <!-- Auth Container -->
    <div id="auth-container" class="auth-container hidden">
        <div class="auth-card">
            <h1>StudyFlow</h1>
            <p>Sua jornada de conhecimento começa aqui</p>
            <button id="google-login" class="btn btn-primary">
                <span>Entrar com Google</span>
            </button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app hidden">
        <!-- Navigation -->
        <nav class="nav">
            <div class="nav-brand">
                <h1>StudyFlow</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="#dashboard" class="nav-link active" data-section="dashboard">Dashboard</a></li>
                <li><a href="#topics" class="nav-link" data-section="topics">Tópicos</a></li>
                <li><a href="#books" class="nav-link" data-section="books">Livros</a></li>
                <li><a href="#notes" class="nav-link" data-section="notes">Anotações</a></li>
                <li><a href="#study" class="nav-link" data-section="study">Estudar</a></li>
                <li><a href="#focus" class="nav-link" data-section="focus">Foco</a></li>
            </ul>
            <div class="nav-user">
                <button id="user-menu" class="btn-user">
                    <img id="user-avatar" src="" alt="Avatar" class="user-avatar">
                </button>
                <button id="logout-btn" class="btn btn-ghost">Sair</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <!-- Content will be loaded dynamically -->
        </main>

        <!-- Study Timer Overlay -->
        <div id="timer-overlay" class="timer-overlay hidden">
            <div class="timer-card">
                <h2>Sessão de Estudo</h2>
                <div class="timer-display">
                    <span id="timer-time">00:00:00</span>
                </div>
                <div class="timer-topic">
                    <span id="current-topic">Tópico Selecionado</span>
                </div>
                <div class="timer-controls">
                    <button id="pause-timer" class="btn btn-secondary">Pausar</button>
                    <button id="stop-timer" class="btn btn-primary">Finalizar</button>
                </div>
                <div class="timer-notes">
                    <textarea id="session-notes" placeholder="Anotações da sessão..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="app.js"></script>
</body>
</html>
